name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Kotlin/Native's toolchain runs on x64 hosts: both targets are built here, and each runs on its own machine below.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build the tests and the playground, linuxX64 and linuxArm64
        run: >-
          ./gradlew --no-daemon
          :kronos:linkDebugTestLinuxX64 :kronos:linkDebugTestLinuxArm64
          :glyph11:linkDebugTestLinuxX64 :glyph11:linkDebugTestLinuxArm64
          :playground:linkReleaseExecutableLinuxX64 :playground:linkReleaseExecutableLinuxArm64

      - name: kronos' and glyph11's tests on the JVM, and the playground's jar
        run: ./gradlew --no-daemon :kronos:jvmTest :glyph11:jvmTest :playground:jvmFatJar

      - uses: actions/upload-artifact@v4
        with:
          name: tests
          path: |
            kronos/build/bin/*/debugTest/test.kexe
            glyph11/build/bin/*/debugTest/test.kexe
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            runner: ubuntu-24.04
          - target: linuxArm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tests

      - name: Machine
        run: |
          uname -srm
          echo "page size: $(getconf PAGESIZE)"
          echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo n/a)"

      # One step per module, each run even when an earlier one failed.
      - name: kronos tests on ${{ matrix.target }}
        run: |
          chmod +x kronos/build/bin/${{ matrix.target }}/debugTest/test.kexe
          ./kronos/build/bin/${{ matrix.target }}/debugTest/test.kexe

      - name: glyph11 tests on ${{ matrix.target }}
        if: success() || failure()
        run: |
          chmod +x glyph11/build/bin/${{ matrix.target }}/debugTest/test.kexe
          ./glyph11/build/bin/${{ matrix.target }}/debugTest/test.kexe
